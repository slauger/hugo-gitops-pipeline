name: Hugo GitOps Pipeline

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry URL'
        required: true
        type: string
      image_name:
        description: 'Image name (without registry)'
        required: true
        type: string
      project_config:
        description: 'Path to project.json config file'
        required: false
        type: string
        default: 'project.json'
      runner:
        description: 'Runner label for all jobs, e.g. a self-hosted runner scale set'
        required: false
        type: string
        default: 'ubuntu-latest'

    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      GITOPS_APP_ID:
        required: true
      GITOPS_APP_PRIVATE_KEY:
        required: true

env:
  # Fallback images - overridden at runtime from release asset
  BUILDER_IMAGE: ghcr.io/slauger/hugo-gitops-pipeline/builder:latest
  RUNTIME_IMAGE: ghcr.io/slauger/hugo-gitops-pipeline/runtime:latest
  PIPELINE_REPO: slauger/hugo-gitops-pipeline

jobs:
  detect-environment:
    name: Detect Environment
    runs-on: ${{ inputs.runner }}
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      hugo_environment: ${{ steps.detect.outputs.hugo_environment }}
      hugo_source: ${{ steps.detect.outputs.hugo_source }}
      baseurl: ${{ steps.detect.outputs.baseurl }}
      output: ${{ steps.detect.outputs.output }}
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
      gitops_repository: ${{ steps.detect.outputs.gitops_repository }}
      gitops_repo_name: ${{ steps.detect.outputs.gitops_repo_name }}
      gitops_branch: ${{ steps.detect.outputs.gitops_branch }}
      gitops_file: ${{ steps.detect.outputs.gitops_file }}
      gitops_owner: ${{ steps.detect.outputs.gitops_owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect environment from project.json
        id: detect
        env:
          CONFIG: ${{ inputs.project_config }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_REF: ${{ github.ref }}
        run: |
          # For pull_request events, use head_ref (source branch) for matching
          # For push events, use the actual ref
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REF="refs/heads/${HEAD_REF}"
            DEPLOY_ALLOWED="false"
          else
            REF="${GIT_REF}"
            DEPLOY_ALLOWED="true"
          fi
          # Values are read from the environment inside node, never interpolated into the script
          export REF DEPLOY_ALLOWED

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file $CONFIG not found"
            exit 1
          fi

          # Find matching environment
          RESULT=$(node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync(process.env.CONFIG));
            const ref = process.env.REF;
            const deployAllowed = process.env.DEPLOY_ALLOWED === 'true';

            let matched = null;
            for (const [name, env] of Object.entries(config.environments || {})) {
              if (env.when && new RegExp(env.when).test(ref)) {
                matched = { name, ...env };
                break;
              }
            }

            if (matched) {
              // Extract branch slug from ref (e.g., refs/heads/feature/login-page -> login-page)
              const branchName = ref.replace(/^refs\/heads\//, '');
              const branchSlug = branchName.split('/').pop().toLowerCase().replace(/[^a-z0-9]/g, '-');

              // Replace variables in baseurl and gitops file
              const replaceVars = (str) => str
                .replace(/\\\${BRANCH_SLUG}/g, branchSlug)
                .replace(/\\\${BRANCH_NAME}/g, branchName);

              console.log(JSON.stringify({
                environment: matched.name,
                hugo_environment: matched.environment || matched.name,
                hugo_source: config.hugo?.source || 'hugo',
                baseurl: replaceVars(matched.baseurl || ''),
                output: config.output || 'public',
                should_deploy: deployAllowed ? 'true' : 'false',
                gitops_repository: matched.gitops?.repository || '',
                gitops_repo_name: (matched.gitops?.repository || '').split('/')[1] || '',
                gitops_branch: matched.gitops?.branch || 'main',
                gitops_file: replaceVars(matched.gitops?.file || ''),
                gitops_owner: (matched.gitops?.repository || '').split('/')[0] || ''
              }));
            } else {
              console.log(JSON.stringify({
                environment: 'none',
                hugo_environment: 'production',
                hugo_source: config.hugo?.source || 'hugo',
                baseurl: '',
                output: config.output || 'public',
                should_deploy: 'false',
                gitops_repository: '',
                gitops_repo_name: '',
                gitops_branch: '',
                gitops_file: '',
                gitops_owner: ''
              }));
            }
          ")

          echo "environment=$(echo $RESULT | jq -r '.environment')" >> $GITHUB_OUTPUT
          echo "hugo_environment=$(echo $RESULT | jq -r '.hugo_environment')" >> $GITHUB_OUTPUT
          echo "hugo_source=$(echo $RESULT | jq -r '.hugo_source')" >> $GITHUB_OUTPUT
          echo "baseurl=$(echo $RESULT | jq -r '.baseurl')" >> $GITHUB_OUTPUT
          echo "output=$(echo $RESULT | jq -r '.output')" >> $GITHUB_OUTPUT
          echo "should_deploy=$(echo $RESULT | jq -r '.should_deploy')" >> $GITHUB_OUTPUT
          echo "gitops_repository=$(echo $RESULT | jq -r '.gitops_repository')" >> $GITHUB_OUTPUT
          echo "gitops_repo_name=$(echo $RESULT | jq -r '.gitops_repo_name')" >> $GITHUB_OUTPUT
          echo "gitops_branch=$(echo $RESULT | jq -r '.gitops_branch')" >> $GITHUB_OUTPUT
          echo "gitops_file=$(echo $RESULT | jq -r '.gitops_file')" >> $GITHUB_OUTPUT
          echo "gitops_owner=$(echo $RESULT | jq -r '.gitops_owner')" >> $GITHUB_OUTPUT

      - name: Environment summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          DETECTED_ENVIRONMENT: ${{ steps.detect.outputs.environment }}
          HUGO_ENVIRONMENT: ${{ steps.detect.outputs.hugo_environment }}
          BASEURL: ${{ steps.detect.outputs.baseurl || '(from Hugo config)' }}
          SHOULD_DEPLOY: ${{ steps.detect.outputs.should_deploy }}
        run: |
          REF_SUFFIX=""
          DEPLOY_SUFFIX=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REF_SUFFIX=" (head: ${HEAD_REF})"
            DEPLOY_SUFFIX=" (disabled for PRs)"
          fi
          {
            echo "## Environment Detection"
            echo ""
            echo "**Event:** \`${EVENT_NAME}\`"
            echo "**Ref:** \`${GIT_REF}\`${REF_SUFFIX}"
            echo "**Environment:** \`${DETECTED_ENVIRONMENT}\`"
            echo "**Hugo Environment:** \`${HUGO_ENVIRONMENT}\`"
            echo "**Base URL:** \`${BASEURL}\`"
            echo "**Should Deploy:** \`${SHOULD_DEPLOY}\`${DEPLOY_SUFFIX}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-and-build:
    name: Lint and Build
    runs-on: ${{ inputs.runner }}
    needs: detect-environment
    container:
      image: ghcr.io/slauger/hugo-gitops-pipeline/builder:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run build phase
        run: run-phase build "${CONFIG}"
        env:
          CONFIG: ${{ inputs.project_config }}
          ENVIRONMENT: ${{ needs.detect-environment.outputs.hugo_environment }}
          HUGO_SOURCE: ${{ needs.detect-environment.outputs.hugo_source }}
          OUTPUT: ${{ needs.detect-environment.outputs.output }}

      - name: Run lint phase
        run: run-phase lint "${CONFIG}"
        env:
          CONFIG: ${{ inputs.project_config }}
          HUGO_SOURCE: ${{ needs.detect-environment.outputs.hugo_source }}
          OUTPUT: ${{ needs.detect-environment.outputs.output }}

      - name: Run test phase
        run: run-phase test "${CONFIG}"
        env:
          CONFIG: ${{ inputs.project_config }}
          HUGO_SOURCE: ${{ needs.detect-environment.outputs.hugo_source }}
          OUTPUT: ${{ needs.detect-environment.outputs.output }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hugo-public
          path: ${{ needs.detect-environment.outputs.hugo_source }}/${{ needs.detect-environment.outputs.output }}/
          retention-days: 1

  build-and-push:
    name: Build and Push Image
    runs-on: ${{ inputs.runner }}
    needs: [detect-environment, lint-and-build]
    if: needs.detect-environment.outputs.should_deploy == 'true'

    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pipeline images from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download images.json from latest release
          ASSET_URL=$(gh release view --repo "${PIPELINE_REPO}" --json assets -q '.assets[] | select(.name=="images.json") | .url')

          if [ -n "$ASSET_URL" ]; then
            IMAGES=$(curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL")
            echo "Resolved images from release:"
            echo "$IMAGES" | jq .

            echo "BUILDER_IMAGE=$(echo $IMAGES | jq -r '.builder.full')" >> $GITHUB_ENV
            echo "RUNTIME_IMAGE=$(echo $IMAGES | jq -r '.runtime.full')" >> $GITHUB_ENV
          else
            echo "::warning::No images.json found in release, using fallback (latest)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix=${{ needs.detect-environment.outputs.environment }}-,format=short
            type=raw,value=${{ needs.detect-environment.outputs.environment }}-latest

      - name: Generate Dockerfile
        env:
          PROJECT_CONFIG: ${{ inputs.project_config }}
          HUGO_ENVIRONMENT: ${{ needs.detect-environment.outputs.hugo_environment }}
          HUGO_SOURCE: ${{ needs.detect-environment.outputs.hugo_source }}
          OUTPUT_DIR: ${{ needs.detect-environment.outputs.output }}
          BASEURL: ${{ needs.detect-environment.outputs.baseurl }}
        run: |
          cat > Dockerfile.generated <<EOF
          FROM ${BUILDER_IMAGE} AS builder
          WORKDIR /build
          COPY . .
          ENV CONFIG=${PROJECT_CONFIG}
          ENV ENVIRONMENT=${HUGO_ENVIRONMENT}
          ENV HUGO_SOURCE=${HUGO_SOURCE}
          ENV OUTPUT=${OUTPUT_DIR}
          ENV BASEURL=${BASEURL}
          RUN run-phase build ${PROJECT_CONFIG}
          RUN mkdir -p /nginx-config && if [ -d nginx ]; then cp -r nginx/* /nginx-config/; fi

          FROM ${RUNTIME_IMAGE}
          COPY --from=builder /build/${HUGO_SOURCE}/${OUTPUT_DIR} /usr/share/nginx/html
          COPY --from=builder /nginx-config/ /etc/nginx/conf.d/
          EOF

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          # Der Build-Record ("*.dockerbuild") wandert sonst als Artefakt in den Storage und
          # bringt seine eigene 90-Tage-Retention mit - nicht die der Organisation.
          # Nur der Upload faellt weg; die Build-Zusammenfassung im Actions-UI bleibt.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.generated
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Build summary
        env:
          DETECTED_ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${DETECTED_ENVIRONMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${REGISTRY}/${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${IMAGE_TAGS}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${IMAGE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy via GitOps
    runs-on: ${{ inputs.runner }}
    needs: [detect-environment, build-and-push]
    if: needs.detect-environment.outputs.should_deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ needs.detect-environment.outputs.gitops_owner }}
          repositories: ${{ needs.detect-environment.outputs.gitops_repo_name }}

      - name: Generate gitops-image-replacer config
        env:
          CONFIG: ${{ inputs.project_config }}
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync(process.env.CONFIG));

            const gitopsConfig = {
              'gitops-image-replacer': Object.entries(config.environments || {}).map(([name, env]) => ({
                repository: env.gitops?.repository || '',
                branch: env.gitops?.branch || 'main',
                file: env.gitops?.file || '',
                when: env.when || ''
              })).filter(e => e.repository && e.file)
            };

            fs.writeFileSync('gitops-image-replacer.json', JSON.stringify(gitopsConfig, null, 2));
          "

          cat gitops-image-replacer.json

      - name: Install gitops-image-replacer
        run: pip install gitops-image-replacer==1.1.2

      - name: Update image in GitOps repository
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_REF: ${{ github.ref }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          IMAGE_FULL="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}@${IMAGE_DIGEST}"

          echo "Updating image to: ${IMAGE_FULL}"
          gitops-image-replacer --ci --apply "${IMAGE_FULL}"

      - name: Deployment summary
        env:
          DETECTED_ENVIRONMENT: ${{ needs.detect-environment.outputs.environment }}
          GITOPS_REPOSITORY: ${{ needs.detect-environment.outputs.gitops_repository }}
          GITOPS_FILE: ${{ needs.detect-environment.outputs.gitops_file }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
        run: |
          echo "## GitOps Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${DETECTED_ENVIRONMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps Repo:** \`${GITOPS_REPOSITORY}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps File:** \`${GITOPS_FILE}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image Digest:** \`${IMAGE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
