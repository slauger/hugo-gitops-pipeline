name: Build Images

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to tag images with (e.g. 1.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag images with (e.g. 1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  # Builder Image
  build-builder-amd64:
    name: Build Builder (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/builder
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/builder:v${{ inputs.version }}-linux-amd64
          cache-from: type=gha,scope=builder-amd64
          cache-to: type=gha,mode=max,scope=builder-amd64

  build-builder-arm64:
    name: Build Builder (arm64)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/builder
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/builder:v${{ inputs.version }}-linux-arm64
          cache-from: type=gha,scope=builder-arm64
          cache-to: type=gha,mode=max,scope=builder-arm64

  manifest-builder:
    name: Create Builder Manifest
    runs-on: ubuntu-latest
    needs: [build-builder-amd64, build-builder-arm64]
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create and push manifest
        id: manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/builder"
          VERSION="v${INPUT_VERSION}"
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64
          DIGEST=$(docker manifest push ${IMAGE}:${VERSION})
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64
          docker manifest push ${IMAGE}:latest
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  # Runtime Image
  build-runtime-amd64:
    name: Build Runtime (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/runtime
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/runtime:v${{ inputs.version }}-linux-amd64
          cache-from: type=gha,scope=runtime-amd64
          cache-to: type=gha,mode=max,scope=runtime-amd64

  build-runtime-arm64:
    name: Build Runtime (arm64)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/runtime
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/runtime:v${{ inputs.version }}-linux-arm64
          cache-from: type=gha,scope=runtime-arm64
          cache-to: type=gha,mode=max,scope=runtime-arm64

  manifest-runtime:
    name: Create Runtime Manifest
    runs-on: ubuntu-latest
    needs: [build-runtime-amd64, build-runtime-arm64]
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create and push manifest
        id: manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/runtime"
          VERSION="v${INPUT_VERSION}"
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64
          DIGEST=$(docker manifest push ${IMAGE}:${VERSION})
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64
          docker manifest push ${IMAGE}:latest
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  # Cleanup Image
  build-cleanup-amd64:
    name: Build Cleanup (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/cleanup
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/cleanup:v${{ inputs.version }}-linux-amd64
          cache-from: type=gha,scope=cleanup-amd64
          cache-to: type=gha,mode=max,scope=cleanup-amd64

  build-cleanup-arm64:
    name: Build Cleanup (arm64)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/cleanup
          push: true
          provenance: false
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/cleanup:v${{ inputs.version }}-linux-arm64
          cache-from: type=gha,scope=cleanup-arm64
          cache-to: type=gha,mode=max,scope=cleanup-arm64

  manifest-cleanup:
    name: Create Cleanup Manifest
    runs-on: ubuntu-latest
    needs: [build-cleanup-amd64, build-cleanup-arm64]
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create and push manifest
        id: manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/cleanup"
          VERSION="v${INPUT_VERSION}"
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64
          DIGEST=$(docker manifest push ${IMAGE}:${VERSION})
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64
          docker manifest push ${IMAGE}:latest
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  # Upload Release Asset
  upload-release-asset:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    needs:
      - build-builder-amd64
      - build-builder-arm64
      - manifest-builder
      - build-runtime-amd64
      - build-runtime-arm64
      - manifest-runtime
      - build-cleanup-amd64
      - build-cleanup-arm64
      - manifest-cleanup
    permissions:
      contents: write

    steps:
      - name: Create images.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUILDER_DIGEST: ${{ needs.manifest-builder.outputs.digest }}
          BUILDER_AMD64_DIGEST: ${{ needs.build-builder-amd64.outputs.digest }}
          BUILDER_ARM64_DIGEST: ${{ needs.build-builder-arm64.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.manifest-runtime.outputs.digest }}
          RUNTIME_AMD64_DIGEST: ${{ needs.build-runtime-amd64.outputs.digest }}
          RUNTIME_ARM64_DIGEST: ${{ needs.build-runtime-arm64.outputs.digest }}
          CLEANUP_DIGEST: ${{ needs.manifest-cleanup.outputs.digest }}
          CLEANUP_AMD64_DIGEST: ${{ needs.build-cleanup-amd64.outputs.digest }}
          CLEANUP_ARM64_DIGEST: ${{ needs.build-cleanup-arm64.outputs.digest }}
        run: |
          VERSION="v${INPUT_VERSION}"
          REPO="${GITHUB_REPOSITORY}"

          cat > images.json <<EOF
          {
            "\$schema": "https://slauger.github.io/hugo-gitops-pipeline/images.schema.json",
            "version": "${INPUT_VERSION}",
            "builder": {
              "image": "${REGISTRY}/${REPO}/builder",
              "tag": "${VERSION}",
              "digest": "${BUILDER_DIGEST}",
              "full": "${REGISTRY}/${REPO}/builder:${VERSION}@${BUILDER_DIGEST}",
              "platforms": {
                "linux/amd64": {
                  "digest": "${BUILDER_AMD64_DIGEST}",
                  "full": "${REGISTRY}/${REPO}/builder:${VERSION}-linux-amd64@${BUILDER_AMD64_DIGEST}"
                },
                "linux/arm64": {
                  "digest": "${BUILDER_ARM64_DIGEST}",
                  "full": "${REGISTRY}/${REPO}/builder:${VERSION}-linux-arm64@${BUILDER_ARM64_DIGEST}"
                }
              }
            },
            "runtime": {
              "image": "${REGISTRY}/${REPO}/runtime",
              "tag": "${VERSION}",
              "digest": "${RUNTIME_DIGEST}",
              "full": "${REGISTRY}/${REPO}/runtime:${VERSION}@${RUNTIME_DIGEST}",
              "platforms": {
                "linux/amd64": {
                  "digest": "${RUNTIME_AMD64_DIGEST}",
                  "full": "${REGISTRY}/${REPO}/runtime:${VERSION}-linux-amd64@${RUNTIME_AMD64_DIGEST}"
                },
                "linux/arm64": {
                  "digest": "${RUNTIME_ARM64_DIGEST}",
                  "full": "${REGISTRY}/${REPO}/runtime:${VERSION}-linux-arm64@${RUNTIME_ARM64_DIGEST}"
                }
              }
            },
            "cleanup": {
              "image": "${REGISTRY}/${REPO}/cleanup",
              "tag": "${VERSION}",
              "digest": "${CLEANUP_DIGEST}",
              "full": "${REGISTRY}/${REPO}/cleanup:${VERSION}@${CLEANUP_DIGEST}",
              "platforms": {
                "linux/amd64": {
                  "digest": "${CLEANUP_AMD64_DIGEST}",
                  "full": "${REGISTRY}/${REPO}/cleanup:${VERSION}-linux-amd64@${CLEANUP_AMD64_DIGEST}"
                },
                "linux/arm64": {
                  "digest": "${CLEANUP_ARM64_DIGEST}",
                  "full": "${REGISTRY}/${REPO}/cleanup:${VERSION}-linux-arm64@${CLEANUP_ARM64_DIGEST}"
                }
              }
            }
          }
          EOF

          cat images.json

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          gh release upload "v${INPUT_VERSION}" images.json --repo "${GITHUB_REPOSITORY}" --clobber
