name: Auto PR Creation

on:
  workflow_call:
    inputs:
      main_branch:
        description: 'Main/production branch name'
        required: false
        type: string
        default: 'main'
      develop_branch:
        description: 'Development branch name'
        required: false
        type: string
        default: 'develop'
      language:
        description: 'Language for PR description (de/en)'
        required: false
        type: string
        default: 'de'
      site_url:
        description: 'Production site URL (optional, for footer)'
        required: false
        type: string
        default: ''
    secrets:
      GH_PAT:
        required: false
        description: 'GitHub Personal Access Token with repo and pull-request permissions (falls back to GITHUB_TOKEN if not set)'
      LLM_API_KEY:
        required: false
        description: 'Optional API key for an OpenAI-compatible chat/completions endpoint. Without it the PR description is the generated commit summary. GitHub Models, which this workflow used to call for free, was retired, so there is no default endpoint.'

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine PR direction
        id: pr-config
        run: |
          REF="${{ github.ref }}"
          BRANCH_NAME="${REF#refs/heads/}"
          MAIN_BRANCH="${{ inputs.main_branch }}"
          DEVELOP_BRANCH="${{ inputs.develop_branch }}"

          # Determine base branch based on source
          if [ "$BRANCH_NAME" = "$DEVELOP_BRANCH" ]; then
            # develop -> main
            echo "base=$MAIN_BRANCH" >> $GITHUB_OUTPUT
            echo "head=$DEVELOP_BRANCH" >> $GITHUB_OUTPUT
            echo "source=$DEVELOP_BRANCH" >> $GITHUB_OUTPUT
            echo "target=$MAIN_BRANCH" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            # feature branch -> develop
            echo "base=$DEVELOP_BRANCH" >> $GITHUB_OUTPUT
            echo "head=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "source=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "target=$DEVELOP_BRANCH" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: check-pr
        run: |
          PR_COUNT=$(gh pr list --base ${{ steps.pr-config.outputs.base }} --head ${{ steps.pr-config.outputs.head }} --state open --json number --jq 'length')
          echo "count=$PR_COUNT" >> $GITHUB_OUTPUT

          if [ "$PR_COUNT" -gt 0 ]; then
            PR_NUMBER=$(gh pr list --base ${{ steps.pr-config.outputs.base }} --head ${{ steps.pr-config.outputs.head }} --state open --json number --jq '.[0].number')
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

            # Matches both the current marker and the older "GitHub Actions & AI" one
            PR_BODY=$(gh pr view $PR_NUMBER --json body --jq '.body')
            if echo "$PR_BODY" | grep -q "🤖.*GitHub Actions"; then
              echo "is_auto=true" >> $GITHUB_OUTPUT
            else
              echo "is_auto=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_auto=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

      - name: Generate PR description
        if: steps.check-pr.outputs.count == '0' || steps.check-pr.outputs.is_auto == 'true'
        id: analyze
        env:
          # Optional. Without a key the categorized commit summary below is the
          # description. GitHub Models, which this step used to call, was
          # retired, so there is no free default endpoint left. Any
          # OpenAI-compatible chat/completions URL works, for example
          # https://api.groq.com/openai/v1/chat/completions
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          SOURCE="${{ steps.pr-config.outputs.source }}"
          TARGET="${{ steps.pr-config.outputs.target }}"
          LANGUAGE="${{ inputs.language }}"

          git fetch origin $TARGET:$TARGET 2>/dev/null || true

          FILES_CHANGED=$(git diff $TARGET..HEAD --stat | tail -40)

          # Group the commits by their conventional-commit type so the
          # description is useful on its own rather than a flat list.
          if [ "$LANGUAGE" = "de" ]; then
            L_FEAT="Features"; L_FIX="Fixes"; L_PERF="Performance"
            L_REFACTOR="Refactoring"; L_TEST="Tests"; L_DOCS="Dokumentation"
            L_CI="Build und CI"; L_CHORE="Chores"; L_OTHER="Sonstiges"
            L_FILES="Geänderte Dateien"
          else
            L_FEAT="Features"; L_FIX="Fixes"; L_PERF="Performance"
            L_REFACTOR="Refactoring"; L_TEST="Tests"; L_DOCS="Documentation"
            L_CI="Build and CI"; L_CHORE="Chores"; L_OTHER="Other"
            L_FILES="Files changed"
          fi

          {
            emit_group() {
              BODY=$(git log $TARGET..HEAD --pretty=format:"- %s (%h)" --no-merges \
                | grep -E "^- $2(\(.+\))?!?: " || true)
              if [ -n "$BODY" ]; then
                printf '### %s\n\n%s\n\n' "$1" "$BODY"
              fi
            }
            emit_group "$L_FEAT" "feat"
            emit_group "$L_FIX" "fix"
            emit_group "$L_PERF" "perf"
            emit_group "$L_REFACTOR" "refactor"
            emit_group "$L_TEST" "test"
            emit_group "$L_DOCS" "docs"
            emit_group "$L_CI" "(build|ci)"
            emit_group "$L_CHORE" "chore"

            OTHER=$(git log $TARGET..HEAD --pretty=format:"- %s (%h)" --no-merges \
              | grep -vE "^- (feat|fix|perf|refactor|test|docs|build|ci|chore)(\(.+\))?!?: " || true)
            if [ -n "$OTHER" ]; then
              printf '### %s\n\n%s\n\n' "$L_OTHER" "$OTHER"
            fi

            printf '<details>\n<summary>%s</summary>\n\n```\n%s\n```\n</details>\n' "$L_FILES" "$FILES_CHANGED"
          } > /tmp/pr_description.txt

          if [ -z "${LLM_API_KEY}" ] || [ -z "${LLM_API_URL}" ]; then
            echo "::notice::No LLM_API_KEY/LLM_API_URL configured, using the generated commit summary"
          else
            COMMITS=$(git log $TARGET..HEAD --pretty=format:"- %s (%h)" --no-merges)

            if [ "$LANGUAGE" = "de" ]; then
              cat > /tmp/prompt.txt <<EOF
          Schreibe eine PR-Beschreibung auf Deutsch für den Merge von $SOURCE nach $TARGET.
          Erkläre WARUM, nicht nur WAS. Keine Titelzeile, kein Vorspann.

          Alle Commits (vollständige Liste):
          $COMMITS

          Geänderte Dateien:
          $FILES_CHANGED

          Format:
          ## Ziel
          - Welches Problem wird gelöst?

          ## Änderungen
          - Kategorisierte Liste, die JEDEN Commit abdeckt

          ## Auswirkungen
          - Sicht der Website-Besucher / des Betreibers
          EOF
            else
              cat > /tmp/prompt.txt <<EOF
          Write a PR description in English for merging $SOURCE into $TARGET.
          Explain WHY, not just WHAT. No title line, no preamble.

          All commits (complete list):
          $COMMITS

          Files changed:
          $FILES_CHANGED

          Format:
          ## Goal
          - What problem is solved?

          ## Changes
          - Categorized list covering EVERY commit

          ## Impact
          - Site visitor / operator perspective
          EOF
            fi

            REQUEST_JSON=$(jq -n \
              --arg system "Technical writer for PR descriptions of a static website project. Explain WHY and PURPOSE, not just WHAT. Be professional and concise. Use the given structure." \
              --arg user "$(cat /tmp/prompt.txt)" \
              --arg model "${LLM_MODEL:-gpt-4.1}" \
              '{
                "messages": [
                  {"role": "system", "content": $system},
                  {"role": "user", "content": $user}
                ],
                "model": $model,
                "temperature": 0.7,
                "max_tokens": 1500
              }')

            # This step runs under `bash -e`, so a failing curl would abort it
            # and the generated summary would never be used. Keep the exit code.
            CURL_EXIT=0
            API_RESPONSE=$(echo "$REQUEST_JSON" | curl -sS --max-time 120 -X POST \
              "${LLM_API_URL}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${LLM_API_KEY}" \
              -d @- 2>/tmp/curl_err.txt) || CURL_EXIT=$?

            ANALYSIS=$(printf '%s' "$API_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)

            if [ -n "$ANALYSIS" ]; then
              printf '%s\n' "$ANALYSIS" > /tmp/pr_description.txt
            else
              # Without this the next outage looks the same as a model that
              # simply returned nothing.
              echo "::warning::LLM request failed, using the generated commit summary"
              echo "curl exit code: ${CURL_EXIT}"
              if [ -s /tmp/curl_err.txt ]; then
                sed 's/^/curl: /' /tmp/curl_err.txt
              fi
              printf '%s' "$API_RESPONSE" | head -c 500 | sed 's/^/response: /'
              echo
            fi
          fi

          echo "description_file=/tmp/pr_description.txt" >> $GITHUB_OUTPUT

      - name: Build PR title
        if: steps.check-pr.outputs.count == '0' || steps.check-pr.outputs.is_auto == 'true'
        id: extract-title
        run: |
          if [ "${{ steps.pr-config.outputs.is_release }}" = "true" ]; then
            TITLE="🚀 Release: ${{ steps.pr-config.outputs.source }} -> ${{ steps.pr-config.outputs.target }}"
          else
            TITLE="🔧 Feature: ${{ steps.pr-config.outputs.source }}"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Build footer
        if: steps.check-pr.outputs.count == '0' || steps.check-pr.outputs.is_auto == 'true'
        id: footer
        run: |
          IS_RELEASE="${{ steps.pr-config.outputs.is_release }}"
          SITE_URL="${{ inputs.site_url }}"
          LANG="${{ inputs.language }}"

          if [ "$IS_RELEASE" = "true" ]; then
            if [ "$LANG" = "de" ]; then
              FOOTER="---

          ## Deployment Info

          **Source:** \`${{ steps.pr-config.outputs.source }}\` branch
          **Target:** \`${{ steps.pr-config.outputs.target }}\` branch

          ### Nach dem Merge:
          - ✅ Production deployment wird ausgelöst"
              if [ -n "$SITE_URL" ]; then
                FOOTER="$FOOTER
          - 🌐 Site: $SITE_URL"
              fi
              FOOTER="$FOOTER

          ### Review Checklist:
          - [ ] Staging/Preview sieht korrekt aus
          - [ ] Keine Console Errors
          - [ ] Alle Seiten laden korrekt

          ---

          🤖 Automatisch generiert mit GitHub Actions"
            else
              FOOTER="---

          ## Deployment Info

          **Source:** \`${{ steps.pr-config.outputs.source }}\` branch
          **Target:** \`${{ steps.pr-config.outputs.target }}\` branch

          ### After merge:
          - ✅ Production deployment will be triggered"
              if [ -n "$SITE_URL" ]; then
                FOOTER="$FOOTER
          - 🌐 Site: $SITE_URL"
              fi
              FOOTER="$FOOTER

          ### Review Checklist:
          - [ ] Staging/Preview looks correct
          - [ ] No console errors
          - [ ] All pages load correctly

          ---

          🤖 Auto-generated with GitHub Actions"
            fi
          else
            if [ "$LANG" = "de" ]; then
              FOOTER="---

          ## Branch Info

          **Feature Branch:** \`${{ steps.pr-config.outputs.source }}\`
          **Target:** \`${{ steps.pr-config.outputs.target }}\`

          ### Nächste Schritte:
          1. Review der Änderungen
          2. Tests prüfen
          3. Nach Merge: PR zu \`${{ inputs.main_branch }}\` wird erstellt

          ---

          🤖 Automatisch generiert mit GitHub Actions"
            else
              FOOTER="---

          ## Branch Info

          **Feature Branch:** \`${{ steps.pr-config.outputs.source }}\`
          **Target:** \`${{ steps.pr-config.outputs.target }}\`

          ### Next Steps:
          1. Review changes
          2. Check tests
          3. After merge: PR to \`${{ inputs.main_branch }}\` will be created

          ---

          🤖 Auto-generated with GitHub Actions"
            fi
          fi

          # Save footer to file for multiline handling
          echo "$FOOTER" > /tmp/pr_footer.txt
          echo "file=/tmp/pr_footer.txt" >> $GITHUB_OUTPUT

      - name: Update existing PR
        if: steps.check-pr.outputs.count != '0' && steps.check-pr.outputs.is_auto == 'true'
        run: |
          DESCRIPTION=$(cat ${{ steps.analyze.outputs.description_file }})
          FOOTER=$(cat ${{ steps.footer.outputs.file }})

          gh pr edit ${{ steps.check-pr.outputs.number }} \
            --title "${{ steps.extract-title.outputs.title }}" \
            --body "$DESCRIPTION

          $FOOTER
          ⚡ Auto-updated on new commits"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

      - name: Create Pull Request
        if: steps.check-pr.outputs.count == '0'
        run: |
          DESCRIPTION=$(cat ${{ steps.analyze.outputs.description_file }})
          FOOTER=$(cat ${{ steps.footer.outputs.file }})

          gh pr create \
            --title "${{ steps.extract-title.outputs.title }}" \
            --body "$DESCRIPTION

          $FOOTER" \
            --base ${{ steps.pr-config.outputs.base }} \
            --head ${{ steps.pr-config.outputs.head }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
